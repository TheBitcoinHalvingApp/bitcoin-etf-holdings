name: Bitcoin ETF holdings

on:
  schedule:
    # 13:20 UTC = 6:20 am Pacific (5:20 am in winter). Issuers post the prior
    # day's holdings overnight; this runs after they have.
    - cron: "20 13 * * *"
    # And the 1st and 16th of each month at 14:00 UTC: refresh the quarterly
    # history from each trust's newest 10-Q or 10-K on EDGAR.
    - cron: "0 14 1,16 * *"
    # And 01:30 UTC = 6:30 pm Pacific: a second mirror pass after FRED posts
    # the day's Treasury yields, stock indexes and oil closes.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - name: Refresh the quarterly history from SEC filings (twice a month)
        if: github.event.schedule == '0 14 1,16 * *' || github.event_name == 'workflow_dispatch'
        run: python backfill_edgar.py
      - name: Pull holdings from the issuers
        if: github.event.schedule == '20 13 * * *' || github.event_name == 'workflow_dispatch'
        run: python etf_holdings.py
      - name: Mirror the Dollar, Market and World sources
        if: github.event.schedule != '0 14 1,16 * *'
        run: python mirror_daily.py
      - name: Commit the new figures
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add etf.json etf_previous.json history.csv history_quarterly.csv mirror
          test -f flows.json && git add flows.json
          test -f etf_baseline.json && git add etf_baseline.json
          git diff --cached --quiet && echo "No change" || git commit -m "ETF holdings $(date -u +%F)"
          git push
