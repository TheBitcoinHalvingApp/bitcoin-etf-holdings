name: Bitcoin ETF holdings

on:
  schedule:
    # 13:20 UTC (9:20 am New York in daylight time, 8:20 am in standard time):
    # the morning mirror pass (FRED, Treasury, IMF, World Bank, CoinGecko,
    # Blockchain.com). No ETF pull.  # PIPE-282 (GH-30)
    - cron: "20 13 * * *"
    # PIPE-282 (GH-4): the one ETF pull, 6:04 pm New York time on weekdays, all
    # year. Cron is UTC, so it fires at 22:04 UTC (6:04 pm in daylight time) and
    # at 23:04 UTC (6:04 pm in standard time), and the gate job lets through only
    # the firing that is 6 pm in New York that day. By then every issuer's file
    # shows the previous trading day's close and none has moved on to the new day
    # (Bitwise posts between 6 and 9 pm, iShares the next afternoon). Minute 4,
    # not 0: GitHub delays, and can drop, runs queued at the top of the hour.
    - cron: "4 22 * * 1-5"
    - cron: "4 23 * * 1-5"
    # 01:30 UTC (9:30 pm New York in daylight time, 8:30 pm in standard time):
    # the evening mirror pass.  # PIPE-282 (GH-30)
    - cron: "30 1 * * *"
    # The 1st and 16th at 14:00 UTC: refresh the quarterly history from each
    # trust's newest 10-Q or 10-K on EDGAR.
    - cron: "0 14 1,16 * *"
  workflow_dispatch:
    inputs:  # PIPE-282 (GH-8): a manual run outside 5 to 8 pm New York time writes nothing unless forced
      force:
        description: "Write the ETF files even outside 5 to 8 pm New York time or on a market holiday"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # PIPE-282 (GH-4): decides whether this firing does anything. Of the two ETF
  # crons only the one that is 6:04 pm in New York today goes on; every other
  # schedule and every manual run goes on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      etf: ${{ steps.g.outputs.etf }}
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          off=$(TZ=America/New_York date +%z)   # -0400 in daylight time, -0500 in standard time
          s="${{ github.event.schedule }}"
          etf=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then etf=true; fi
          if [ "$s" = "4 22 * * 1-5" ] && [ "$off" = "-0400" ]; then etf=true; fi
          if [ "$s" = "4 23 * * 1-5" ] && [ "$off" = "-0500" ]; then etf=true; fi
          run=true
          if [ "$etf" = "false" ] && { [ "$s" = "4 22 * * 1-5" ] || [ "$s" = "4 23 * * 1-5" ]; }; then run=false; fi
          echo "schedule [$s], New York offset $off: etf=$etf run=$run"
          echo "etf=$etf" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
  pull:
    needs: gate  # PIPE-282 (GH-4)
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # PIPE-282 (GH-30)
    concurrency:  # PIPE-282 (GH-11): one data run at a time, so two runs never push over each other
      group: data-repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install  # PIPE-282 (GH-13): openpyxl reads Grayscale's workbooks, tzdata backs zoneinfo
        run: pip install requests beautifulsoup4 openpyxl tzdata
      - name: Install Chromium (ETF pull only)  # PIPE-282 (GH-13)
        if: needs.gate.outputs.etf == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Refresh the quarterly history from SEC filings (twice a month)
        id: edgar  # PIPE-282 (GH-12)
        if: github.event.schedule == '0 14 1,16 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true  # PIPE-282 (GH-12): an SEC failure must not block the ETF pull and the commit
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}  # PIPE-282 (GH-14)
        run: python backfill_edgar.py
      - name: Pull holdings from the issuers
        if: needs.gate.outputs.etf == 'true'  # PIPE-282 (GH-4)
        env:
          ETF_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}  # PIPE-282 (GH-8)
        run: python etf_holdings.py
      - name: Mirror the Dollar, Market and World sources
        id: mirror  # PIPE-282 (GH-12)
        if: github.event.schedule == '20 13 * * *' || github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true  # PIPE-282 (GH-12): a mirror failure must not block the commit
        run: python mirror_daily.py
      - name: Commit the new figures
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add etf.json etf_previous.json history.csv history_quarterly.csv mirror
          if [ -f flows.json ]; then git add flows.json; fi  # PIPE-282 (GH-30)
          if [ -f etf_baseline.json ]; then git add etf_baseline.json; fi  # PIPE-282 (GH-30)
          if git diff --cached --quiet; then echo "No change"; exit 0; fi  # PIPE-282 (GH-30)
          git commit -m "Data $(date -u +%F) (${{ github.event.schedule || 'manual run' }})"  # PIPE-282 (GH-30)
          # PIPE-282 (GH-11): pick up any commit made on GitHub during the run, then push; three tries
          for _ in 1 2 3; do
            if git pull --rebase origin main; then
              if git push; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 15
          done
          echo "push failed three times"
          exit 1
      - name: Report a failed EDGAR or mirror step (after the commit)  # PIPE-282 (GH-12)
        if: steps.edgar.outcome == 'failure' || steps.mirror.outcome == 'failure'
        run: |
          echo "EDGAR step: ${{ steps.edgar.outcome }}; mirror step: ${{ steps.mirror.outcome }}"
          exit 1
