name: Bitcoin ETF holdings

on:
  schedule:
    # 13:20 UTC = 9:20 am Eastern: the morning mirror pass (FRED, Treasury,
    # IMF, World Bank, CoinGecko, Blockchain.com). No ETF pull: iShares has
    # not posted the previous close yet at that hour.
    - cron: "20 13 * * *"
    # 22:00 UTC = 6 pm Eastern, weekdays: the one ETF pull. By then every
    # issuer's file shows the previous trading day's close and none has moved
    # on to the new day (Bitwise posts between 6 and 9 pm, iShares next
    # afternoon), so every fund lands on the same trading day.
    - cron: "0 22 * * 1-5"
    # 01:30 UTC = 9:30 pm Eastern: the evening mirror pass, after FRED posts
    # the day's yields, stock indexes and oil closes.
    - cron: "30 1 * * *"
    # The 1st and 16th at 14:00 UTC: refresh the quarterly history from each
    # trust's newest 10-Q or 10-K on EDGAR.
    - cron: "0 14 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - name: Refresh the quarterly history from SEC filings (twice a month)
        if: github.event.schedule == '0 14 1,16 * *' || github.event_name == 'workflow_dispatch'
        run: python backfill_edgar.py
      - name: Pull holdings from the issuers
        if: github.event.schedule == '0 22 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python etf_holdings.py
      - name: Mirror the Dollar, Market and World sources
        if: github.event.schedule == '20 13 * * *' || github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
        run: python mirror_daily.py
      - name: Commit the new figures
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add etf.json etf_previous.json history.csv history_quarterly.csv mirror
          test -f flows.json && git add flows.json
          test -f etf_baseline.json && git add etf_baseline.json
          git diff --cached --quiet && echo "No change" || git commit -m "ETF holdings $(date -u +%F)"
          git push
